<g transform="translate(58,42) rotate(-4 390 310)" filter="url(#deepShadow)">
<rect width="760" height="620" rx="34" fill="#172B62"/>
<rect width="760" height="620" rx="34" fill="url(#navy)" opacity=".62"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="26">
<text x="42" y="70" fill="#C8D5FF">1</text><text x="88" y="70" fill="#FFFFFF">import React from 'react';</text>
<text x="42" y="116" fill="#C8D5FF">2</text><text x="88" y="116" fill="#FFFFFF">import { View, Text } from 'react-native';</text>
<text x="42" y="162" fill="#C8D5FF">3</text><text x="88" y="162" fill="#FFFFFF"></text>
<text x="42" y="208" fill="#C8D5FF">4</text><text x="88" y="208" fill="#FFFFFF">export default function</text>
<text x="42" y="254" fill="#C8D5FF">5</text><text x="88" y="254" fill="#FFFFFF">HomeScreen() {</text>
<text x="42" y="300" fill="#C8D5FF">6</text><text x="88" y="300" fill="#FFFFFF">  return (</text>
<text x="42" y="346" fill="#C8D5FF">7</text><text x="88" y="346" fill="#FFFFFF">    &lt;View style={{ flex: 1,</text>
<text x="42" y="392" fill="#C8D5FF">8</text><text x="88" y="392" fill="#FFFFFF">      justifyContent: 'center',</text>
<text x="42" y="438" fill="#C8D5FF">9</text><text x="88" y="438" fill="#FFFFFF">      alignItems: 'center' }}&gt;</text>
<text x="42" y="484" fill="#C8D5FF">10</text><text x="88" y="484" fill="#FFFFFF">      &lt;Text&gt;Hello App&lt;/Text&gt;</text>
<text x="42" y="530" fill="#C8D5FF">11</text><text x="88" y="530" fill="#FFFFFF">    &lt;/View&gt;</text>
<text x="42" y="576" fill="#C8D5FF">12</text><text x="88" y="576" fill="#FFFFFF">  );</text>
</g>
</g></svg>